name: Build Linter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: write  # This allows the workflow to create/edit releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Test
      run: go test ./...

    - name: Build linter
      run: go build -o ilinter ./cmd/ilinter

    - name: Upload binary as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ilinter-binary
        path: ilinter

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build linter
      run: go build -o ilinter ./cmd/ilinter

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
        files: ilinter
